<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" style="background:#fafaf7;font-family:'Segoe Print','Comic Sans MS','Chalkboard SE',cursive">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="16" font-weight="bold" fill="#1a1a18">Option 1 — Data flow</text>

  <!-- REQUEST column -->
  <text x="165" y="50" font-size="11" fill="#888" text-anchor="middle">request path →</text>
  <!-- RESPONSE column -->
  <text x="495" y="50" font-size="11" fill="#888" text-anchor="middle">← response path</text>

  <!-- Nodes — request side -->
  <!-- Consumer -->
  <rect x="80" y="60" width="170" height="44" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
  <text x="165" y="80" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer</text>
  <text x="165" y="96" font-size="10" fill="#888" text-anchor="middle">SOAP request (RequestDTO-X)</text>

  <line x1="165" y1="105" x2="165" y2="125" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="80" y="126" width="170" height="44" rx="4" fill="#fafaf7" stroke="#2563EB" stroke-width="1.4"/>
  <text x="165" y="146" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">SOAP Contract</text>
  <text x="165" y="162" font-size="10" fill="#888" text-anchor="middle">passes RequestDTO to REST client</text>

  <line x1="165" y1="171" x2="165" y2="191" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="80" y="192" width="170" height="56" rx="4" fill="#fafaf7" stroke="#888" stroke-width="1.3"/>
  <text x="165" y="212" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">REST Client</text>
  <text x="165" y="228" font-size="10" fill="#888" text-anchor="middle">wraps RequestDTO → DecisionDTO</text>
  <text x="165" y="242" font-size="10" fill="#888" text-anchor="middle">HTTP POST to Spring Boot</text>

  <line x1="165" y1="249" x2="165" y2="269" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="80" y="270" width="170" height="56" rx="4" fill="#fafaf7" stroke="#059669" stroke-width="1.8"/>
  <text x="165" y="290" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">Spring Boot Client</text>
  <text x="165" y="306" font-size="10" fill="#888" text-anchor="middle">receives DecisionDTO</text>
  <text x="165" y="320" font-size="10" fill="#888" text-anchor="middle">invokes Camunda</text>

  <line x1="165" y1="327" x2="165" y2="347" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="80" y="348" width="170" height="44" rx="4" fill="#fafaf7" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="165" y="368" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">Camunda Platform</text>
  <text x="165" y="384" font-size="10" fill="#888" text-anchor="middle">executes process / decision</text>

  <!-- Divider -->
  <line x1="330" y1="44" x2="330" y2="400" stroke="#ddd" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="330" y="400" font-size="11" fill="#bbb" text-anchor="middle">↕</text>

  <!-- RESPONSE side (mirror) -->
  <defs>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="410" y="348" width="170" height="44" rx="4" fill="#fafaf7" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="495" y="368" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">Camunda Platform</text>
  <text x="495" y="384" font-size="10" fill="#888" text-anchor="middle">returns execution result</text>

  <line x1="495" y1="347" x2="495" y2="327" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="410" y="270" width="170" height="56" rx="4" fill="#fafaf7" stroke="#059669" stroke-width="1.8"/>
  <text x="495" y="290" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">Spring Boot Client</text>
  <text x="495" y="306" font-size="10" fill="#888" text-anchor="middle">builds ResponseDTO</text>
  <text x="495" y="320" font-size="10" fill="#888" text-anchor="middle">returns as HTTP response</text>

  <line x1="495" y1="269" x2="495" y2="249" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="410" y="192" width="170" height="56" rx="4" fill="#fafaf7" stroke="#888" stroke-width="1.3"/>
  <text x="495" y="212" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">REST Client</text>
  <text x="495" y="228" font-size="10" fill="#888" text-anchor="middle">receives ResponseDTO</text>
  <text x="495" y="242" font-size="10" fill="#888" text-anchor="middle">no re-mapping</text>

  <line x1="495" y1="191" x2="495" y2="171" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="410" y="126" width="170" height="44" rx="4" fill="#fafaf7" stroke="#2563EB" stroke-width="1.4"/>
  <text x="495" y="146" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">SOAP Contract</text>
  <text x="495" y="162" font-size="10" fill="#888" text-anchor="middle">returns ResponseDTO as SOAP</text>

  <line x1="495" y1="125" x2="495" y2="105" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="410" y="60" width="170" height="44" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
  <text x="495" y="80" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer</text>
  <text x="495" y="96" font-size="10" fill="#888" text-anchor="middle">receives ResponseDTO-X</text>
</svg>
