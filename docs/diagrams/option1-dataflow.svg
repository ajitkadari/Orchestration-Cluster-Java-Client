<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 610" width="660" height="610" style="background:#fafaf7;font-family:'Segoe Print','Comic Sans MS','Chalkboard SE',cursive">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="16" font-weight="bold" fill="#1a1a18">Option 1 — Data flow</text>

  <!-- REQUEST column -->
  <text x="165" y="50" font-size="11" fill="#888" text-anchor="middle">request path →</text>
  <!-- RESPONSE column -->
  <text x="495" y="50" font-size="11" fill="#888" text-anchor="middle">← response path</text>

  <!-- SOAP service boxes (request path / response path) -->
  <rect x="58" y="130" width="214" height="174" rx="6" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="8 5"/>
  <text x="80" y="126" font-size="10" fill="#888">SOAP Service</text>
  <rect x="388" y="130" width="214" height="174" rx="6" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="8 5"/>
  <text x="410" y="126" font-size="10" fill="#888">SOAP Service</text>

  <!-- Nodes — request side -->
  <!-- Consumer -->
  <rect x="70" y="60" width="190" height="52" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
  <text x="165" y="82" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer</text>
  <text x="165" y="98" font-size="10" fill="#888" text-anchor="middle">SOAP request</text>
  <text x="165" y="110" font-size="10" fill="#888" text-anchor="middle">(BusinessRequestDTO-X)</text>

  <line x1="165" y1="113" x2="165" y2="133" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="70" y="134" width="190" height="56" rx="4" fill="#fafaf7" stroke="#2563EB" stroke-width="1.4"/>
  <text x="165" y="154" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">SOAP Contract</text>
  <text x="165" y="170" font-size="10" fill="#888" text-anchor="middle">passes BusinessRequestDTO-X</text>
  <text x="165" y="182" font-size="10" fill="#888" text-anchor="middle">to REST client</text>

  <line x1="165" y1="191" x2="165" y2="211" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="70" y="212" width="190" height="72" rx="4" fill="#fafaf7" stroke="#888" stroke-width="1.3"/>
  <text x="165" y="232" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">REST Client</text>
  <text x="165" y="248" font-size="10" fill="#888" text-anchor="middle">wraps BusinessRequestDTO-X</text>
  <text x="165" y="260" font-size="10" fill="#888" text-anchor="middle">to DecisionDTO</text>
  <text x="165" y="272" font-size="10" fill="#888" text-anchor="middle">HTTP POST DecisionDTO to Spring Boot client</text>

  <line x1="165" y1="285" x2="165" y2="305" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="70" y="306" width="190" height="72" rx="4" fill="#fafaf7" stroke="#059669" stroke-width="1.8"/>
  <text x="165" y="326" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">Spring Boot Client</text>
  <text x="165" y="342" font-size="10" fill="#888" text-anchor="middle">(uses Camunda Client)</text>
  <text x="165" y="354" font-size="10" fill="#888" text-anchor="middle">receives DecisionDTO</text>
  <text x="165" y="366" font-size="10" fill="#888" text-anchor="middle">and invokes Camunda</text>

  <line x1="165" y1="379" x2="165" y2="399" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="70" y="400" width="190" height="52" rx="4" fill="#fafaf7" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="165" y="420" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">Camunda Platform</text>
  <text x="165" y="436" font-size="10" fill="#888" text-anchor="middle">executes process / decision</text>

  <!-- Divider -->
  <line x1="330" y1="44" x2="330" y2="470" stroke="#ddd" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="330" y="470" font-size="11" fill="#bbb" text-anchor="middle">↕</text>

  <!-- RESPONSE side (mirror) -->
  <defs>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="400" y="400" width="190" height="52" rx="4" fill="#fafaf7" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="495" y="420" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">Camunda Platform</text>
  <text x="495" y="436" font-size="10" fill="#888" text-anchor="middle">returns execution result</text>

  <line x1="495" y1="399" x2="495" y2="379" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="400" y="306" width="190" height="72" rx="4" fill="#fafaf7" stroke="#059669" stroke-width="1.8"/>
  <text x="495" y="326" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">Spring Boot Client</text>
  <text x="495" y="342" font-size="10" fill="#888" text-anchor="middle">(uses Camunda Client)</text>
  <text x="495" y="354" font-size="10" fill="#888" text-anchor="middle">returns EvaluateDecisionResponse</text>
  <text x="495" y="366" font-size="10" fill="#888" text-anchor="middle">as HTTP response</text>

  <line x1="495" y1="305" x2="495" y2="285" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="400" y="212" width="190" height="72" rx="4" fill="#fafaf7" stroke="#888" stroke-width="1.3"/>
  <text x="495" y="232" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">REST Client</text>
  <text x="495" y="248" font-size="10" fill="#888" text-anchor="middle">uses EvaluateDecisionResponse</text>
  <text x="495" y="260" font-size="10" fill="#888" text-anchor="middle">to complete</text>
  <text x="495" y="272" font-size="10" fill="#888" text-anchor="middle">BusinessResponseDTO-X</text>

  <line x1="495" y1="211" x2="495" y2="191" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="400" y="134" width="190" height="56" rx="4" fill="#fafaf7" stroke="#2563EB" stroke-width="1.4"/>
  <text x="495" y="154" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">SOAP Contract</text>
  <text x="495" y="170" font-size="10" fill="#888" text-anchor="middle">returns BusinessResponseDTO-X</text>
  <text x="495" y="182" font-size="10" fill="#888" text-anchor="middle">as SOAP</text>

  <line x1="495" y1="133" x2="495" y2="113" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <rect x="400" y="60" width="190" height="52" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
  <text x="495" y="82" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer</text>
  <text x="495" y="98" font-size="10" fill="#888" text-anchor="middle">receives</text>
  <text x="495" y="110" font-size="10" fill="#888" text-anchor="middle">BusinessResponseDTO-X</text>

  <!-- Further considerations -->
  <rect x="24" y="472" width="612" height="122" rx="8" fill="#fffdfa" stroke="#d6d3d1" stroke-width="1.1"/>
  <text x="36" y="494" font-size="12" font-weight="bold" fill="#1a1a18">Further considerations (Option 1)</text>

  <text x="40" y="514" font-size="10" font-weight="bold" fill="#059669">Centralized in Spring Boot client:</text>
  <text x="40" y="529" font-size="10" fill="#666">retry/circuit-breaker/fallback defined once for all SOAP services</text>
  <text x="40" y="543" font-size="10" fill="#666">Camunda credentials and authentication managed in one place</text>
  <text x="40" y="557" font-size="10" fill="#666">observability/tracing and Camunda integration tests consolidated</text>

  <text x="352" y="514" font-size="10" font-weight="bold" fill="#2563EB">Contract boundaries:</text>
  <text x="352" y="529" font-size="10" fill="#666">BusinessRequestDTO-X / BusinessResponseDTO-X = external SOAP contract</text>
  <text x="352" y="543" font-size="10" fill="#666">DecisionDTO / EvaluateDecisionResponse = internal REST payloads</text>
  <text x="352" y="557" font-size="10" fill="#666">DecisionDTO versioning is shared; all SOAP REST clients must align</text>
</svg>
