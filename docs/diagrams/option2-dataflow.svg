<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 620" width="660" height="620" style="background:#fafaf7;font-family:'Segoe Print','Comic Sans MS','Chalkboard SE',cursive">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="16" font-weight="bold" fill="#1a1a18">Option 2 — Data flow</text>

  <text x="165" y="50" font-size="11" fill="#888" text-anchor="middle">request path →</text>
  <text x="495" y="50" font-size="11" fill="#888" text-anchor="middle">← response path</text>

  <!-- REQUEST side -->
  <rect x="80" y="55" width="170" height="55" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
  <text x="165" y="75" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer</text>
  <text x="165" y="88" font-size="10" fill="#888" text-anchor="middle">SOAP request</text>
  <text x="165" y="100" font-size="10" fill="#888" text-anchor="middle">(BusinessRequestDTO-X)</text>

  <line x1="165" y1="111" x2="165" y2="140" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SOAP service boxes (request path / response path) -->
  <rect x="68" y="130" width="194" height="190" rx="6" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="8 5"/>
  <text x="80" y="126" font-size="10" fill="#888" font-style="italic">SOAP Service</text>
  <rect x="398" y="130" width="194" height="190" rx="6" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="8 5"/>
  <text x="410" y="126" font-size="10" fill="#888" font-style="italic">SOAP Service</text>

  <rect x="80" y="140" width="170" height="64" rx="4" fill="#fafaf7" stroke="#2563EB" stroke-width="1.4"/>
  <text x="165" y="158" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">SOAP Contract</text>
  <text x="165" y="176" font-size="10" fill="#888" text-anchor="middle">passes BusinessRequestDTO-X</text>
  <text x="165" y="194" font-size="10" fill="#888" text-anchor="middle">to REST Client</text>

  <line x1="165" y1="205" x2="165" y2="218" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="80" y="218" width="170" height="94" rx="4" fill="#fafaf7" stroke="#888" stroke-width="1.3"/>
  <text x="165" y="236" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">REST Client</text>
  <text x="165" y="254" font-size="10" fill="#888" text-anchor="middle">wraps BusinessRequestDTO-X</text>
  <text x="165" y="268" font-size="10" fill="#888" text-anchor="middle">to DecisionDTO</text>
  <text x="165" y="282" font-size="10" fill="#888" text-anchor="middle">invokes Camunda directly</text>
  <text x="165" y="296" font-size="10" fill="#888" text-anchor="middle">via CamundaClient</text>

  <line x1="165" y1="313" x2="165" y2="340" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="80" y="340" width="170" height="52" rx="4" fill="#fafaf7" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="165" y="360" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">Camunda Platform</text>
  <text x="165" y="378" font-size="10" fill="#888" text-anchor="middle">executes process / decision</text>



  <!-- RESPONSE side -->
  <rect x="410" y="340" width="170" height="52" rx="4" fill="#fafaf7" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="495" y="360" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">Camunda Platform</text>
  <text x="495" y="378" font-size="10" fill="#888" text-anchor="middle">returns execution result</text>

  <line x1="495" y1="339" x2="495" y2="313" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="410" y="218" width="170" height="94" rx="4" fill="#fafaf7" stroke="#888" stroke-width="1.3"/>
  <text x="495" y="236" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">REST Client</text>
  <text x="495" y="254" font-size="10" fill="#888" text-anchor="middle">uses EvaluateDecisionResponse</text>
  <text x="495" y="268" font-size="10" fill="#888" text-anchor="middle">to complete</text>
  <text x="495" y="296" font-size="10" fill="#888" text-anchor="middle">BusinessResponseDTO-X</text>

  <line x1="495" y1="217" x2="495" y2="205" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="410" y="140" width="170" height="64" rx="4" fill="#fafaf7" stroke="#2563EB" stroke-width="1.4"/>
  <text x="495" y="158" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">SOAP Contract</text>
  <text x="495" y="176" font-size="10" fill="#888" text-anchor="middle">returns BusinessResponseDTO-X</text>
  <text x="495" y="194" font-size="10" fill="#888" text-anchor="middle">as SOAP</text>

  <line x1="495" y1="139" x2="495" y2="111" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="410" y="55" width="170" height="55" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
  <text x="495" y="75" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer</text>
  <text x="495" y="88" font-size="10" fill="#888" text-anchor="middle">receives</text>
  <text x="495" y="100" font-size="10" fill="#888" text-anchor="middle">BusinessResponseDTO-X</text>

  <!-- Divider - drawn last so it appears on top -->
  <line x1="330" y1="44" x2="330" y2="420" stroke="#ddd" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- Further considerations -->
  <rect x="24" y="445" width="612" height="146" rx="8" fill="#fffdfa" stroke="#d6d3d1" stroke-width="1.1"/>
  <text x="36" y="467" font-size="12" font-weight="bold" fill="#1a1a18">Further considerations (Option 2)</text>

  <text x="40" y="487" font-size="10" font-weight="bold" fill="#7C3AED">Per SOAP service ownership:</text>
  <text x="40" y="502" font-size="10" fill="#666">retry/circuit-breaker/fallback must be</text>
  <text x="40" y="516" font-size="10" fill="#666">implemented in every service</text>
  <text x="40" y="530" font-size="10" fill="#666">Camunda credentials/authentication managed</text>
  <text x="40" y="544" font-size="10" fill="#666">independently per service</text>
  <text x="40" y="558" font-size="10" fill="#666">observability/tracing and Camunda integration</text>
  <text x="40" y="572" font-size="10" fill="#666">tests duplicated per service</text>

  <text x="352" y="487" font-size="10" font-weight="bold" fill="#2563EB">Contract boundaries:</text>
  <text x="352" y="502" font-size="10" fill="#666">BusinessRequestDTO-X / BusinessResponseDTO-X</text>
  <text x="352" y="516" font-size="10" fill="#666">= external SOAP contract</text>
  <text x="352" y="530" font-size="10" fill="#666">DecisionDTO / EvaluateDecisionResponse</text>
  <text x="352" y="544" font-size="10" fill="#666">= internal integration payloads</text>
  <text x="352" y="558" font-size="10" fill="#666">DecisionDTO versioning is shared across all</text>
  <text x="352" y="572" font-size="10" fill="#666">SOAP REST clients</text>

</svg>
