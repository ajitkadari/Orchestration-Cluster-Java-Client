<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 560" width="660" height="560" style="background:#fafaf7;font-family:'Segoe Print','Comic Sans MS','Chalkboard SE',cursive">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="16" font-weight="bold" fill="#1a1a18">Option 2 — Data flow</text>

  <text x="165" y="50" font-size="11" fill="#888" text-anchor="middle">request path →</text>
  <text x="495" y="50" font-size="11" fill="#888" text-anchor="middle">← response path</text>

  <!-- SOAP service boxes (request path / response path) -->
  <rect x="68" y="122" width="194" height="158" rx="6" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="8 5"/>
  <text x="80" y="118" font-size="10" fill="#888">SOAP Service</text>
  <rect x="398" y="122" width="194" height="158" rx="6" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="8 5"/>
  <text x="410" y="118" font-size="10" fill="#888">SOAP Service</text>

  <!-- REQUEST side -->
  <rect x="80" y="60" width="170" height="44" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
  <text x="165" y="80" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer</text>
  <text x="165" y="96" font-size="10" fill="#888" text-anchor="middle">SOAP request (BusinessRequestDTO-X)</text>

  <line x1="165" y1="105" x2="165" y2="125" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="80" y="126" width="170" height="56" rx="4" fill="#fafaf7" stroke="#2563EB" stroke-width="1.4"/>
  <text x="165" y="146" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">SOAP Contract</text>
  <text x="165" y="162" font-size="10" fill="#888" text-anchor="middle">passes BusinessRequestDTO-X</text>
  <text x="165" y="174" font-size="10" fill="#888" text-anchor="middle">to REST Client</text>

  <line x1="165" y1="183" x2="165" y2="191" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="80" y="192" width="170" height="80" rx="4" fill="#fafaf7" stroke="#888" stroke-width="1.3"/>
  <text x="165" y="212" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">REST Client</text>
  <text x="165" y="228" font-size="10" fill="#888" text-anchor="middle">wraps BusinessRequestDTO-X</text>
  <text x="165" y="242" font-size="10" fill="#888" text-anchor="middle">to DecisionDTO</text>
  <text x="165" y="256" font-size="10" fill="#888" text-anchor="middle">invokes Camunda directly</text>
  <text x="165" y="268" font-size="10" fill="#888" text-anchor="middle">via CamundaClient</text>

  <line x1="165" y1="273" x2="165" y2="301" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="80" y="302" width="170" height="44" rx="4" fill="#fafaf7" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="165" y="322" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">Camunda Platform</text>
  <text x="165" y="338" font-size="10" fill="#888" text-anchor="middle">executes process / decision</text>

  <!-- Divider -->
  <line x1="330" y1="44" x2="330" y2="380" stroke="#ddd" stroke-width="0.8" stroke-dasharray="5 4"/>

  <!-- RESPONSE side -->
  <rect x="410" y="302" width="170" height="44" rx="4" fill="#fafaf7" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="495" y="322" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">Camunda Platform</text>
  <text x="495" y="338" font-size="10" fill="#888" text-anchor="middle">returns execution result</text>

  <line x1="495" y1="301" x2="495" y2="273" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="410" y="192" width="170" height="80" rx="4" fill="#fafaf7" stroke="#888" stroke-width="1.3"/>
  <text x="495" y="212" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">REST Client</text>
  <text x="495" y="228" font-size="10" fill="#888" text-anchor="middle">uses EvaluateDecisionResponse</text>
  <text x="495" y="242" font-size="10" fill="#888" text-anchor="middle">to complete</text>
  <text x="495" y="256" font-size="10" fill="#888" text-anchor="middle">BusinessResponseDTO-X</text>

  <line x1="495" y1="191" x2="495" y2="183" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="410" y="126" width="170" height="56" rx="4" fill="#fafaf7" stroke="#2563EB" stroke-width="1.4"/>
  <text x="495" y="146" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">SOAP Contract</text>
  <text x="495" y="162" font-size="10" fill="#888" text-anchor="middle">returns BusinessResponseDTO-X</text>
  <text x="495" y="174" font-size="10" fill="#888" text-anchor="middle">as SOAP</text>

  <line x1="495" y1="125" x2="495" y2="105" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="410" y="60" width="170" height="44" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
  <text x="495" y="80" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer</text>
  <text x="495" y="96" font-size="10" fill="#888" text-anchor="middle">receives BusinessResponseDTO-X</text>


  <!-- Further considerations -->
  <rect x="24" y="392" width="612" height="146" rx="8" fill="#fffdfa" stroke="#d6d3d1" stroke-width="1.1"/>
  <text x="36" y="414" font-size="12" font-weight="bold" fill="#1a1a18">Further considerations (Option 2)</text>

  <text x="40" y="434" font-size="10" font-weight="bold" fill="#7C3AED">Per SOAP service ownership:</text>
  <text x="40" y="449" font-size="10" fill="#666">retry/circuit-breaker/fallback must be</text>
  <text x="40" y="463" font-size="10" fill="#666">implemented in every service</text>
  <text x="40" y="477" font-size="10" fill="#666">Camunda credentials/authentication managed</text>
  <text x="40" y="491" font-size="10" fill="#666">independently per service</text>
  <text x="40" y="505" font-size="10" fill="#666">observability/tracing and Camunda integration</text>
  <text x="40" y="519" font-size="10" fill="#666">tests duplicated per service</text>

  <text x="352" y="434" font-size="10" font-weight="bold" fill="#2563EB">Contract boundaries:</text>
  <text x="352" y="449" font-size="10" fill="#666">BusinessRequestDTO-X / BusinessResponseDTO-X</text>
  <text x="352" y="463" font-size="10" fill="#666">= external SOAP contract</text>
  <text x="352" y="477" font-size="10" fill="#666">DecisionDTO / EvaluateDecisionResponse</text>
  <text x="352" y="491" font-size="10" fill="#666">= internal integration payloads</text>
  <text x="352" y="505" font-size="10" fill="#666">DecisionDTO versioning is shared across all</text>
  <text x="352" y="519" font-size="10" fill="#666">SOAP REST clients</text>

</svg>
