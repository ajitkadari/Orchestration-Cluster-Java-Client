<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" style="background:#fafaf7;font-family:'Segoe Print','Comic Sans MS','Chalkboard SE',cursive">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="16" font-weight="bold" fill="#1a1a18">Option 2 — Data flow</text>

  <text x="165" y="50" font-size="11" fill="#888" text-anchor="middle">request path →</text>
  <text x="495" y="50" font-size="11" fill="#888" text-anchor="middle">← response path</text>

  <!-- REQUEST side -->
  <rect x="80" y="60" width="170" height="44" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
  <text x="165" y="80" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer</text>
  <text x="165" y="96" font-size="10" fill="#888" text-anchor="middle">SOAP request (RequestDTO-X)</text>

  <line x1="165" y1="105" x2="165" y2="125" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="80" y="126" width="170" height="44" rx="4" fill="#fafaf7" stroke="#2563EB" stroke-width="1.4"/>
  <text x="165" y="146" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">SOAP Contract</text>
  <text x="165" y="162" font-size="10" fill="#888" text-anchor="middle">passes RequestDTO</text>

  <line x1="165" y1="171" x2="165" y2="191" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="80" y="192" width="170" height="68" rx="4" fill="#fafaf7" stroke="#888" stroke-width="1.3"/>
  <text x="165" y="212" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">REST Client</text>
  <text x="165" y="228" font-size="10" fill="#888" text-anchor="middle">wraps RequestDTO → DecisionDTO</text>
  <text x="165" y="244" font-size="10" fill="#888" text-anchor="middle">invokes Camunda directly</text>
  <text x="165" y="255" font-size="10" fill="#888" text-anchor="middle">via CamundaClient</text>

  <line x1="165" y1="261" x2="165" y2="281" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="80" y="282" width="170" height="44" rx="4" fill="#fafaf7" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="165" y="302" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">Camunda Platform</text>
  <text x="165" y="318" font-size="10" fill="#888" text-anchor="middle">executes process / decision</text>

  <!-- Divider -->
  <line x1="330" y1="44" x2="330" y2="360" stroke="#ddd" stroke-width="0.8" stroke-dasharray="5 4"/>

  <!-- RESPONSE side -->
  <rect x="410" y="282" width="170" height="44" rx="4" fill="#fafaf7" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="495" y="302" font-size="12" font-weight="bold" fill="#7C3AED" text-anchor="middle">Camunda Platform</text>
  <text x="495" y="318" font-size="10" fill="#888" text-anchor="middle">returns execution result</text>

  <line x1="495" y1="281" x2="495" y2="261" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="410" y="192" width="170" height="68" rx="4" fill="#fafaf7" stroke="#888" stroke-width="1.3"/>
  <text x="495" y="212" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">REST Client</text>
  <text x="495" y="228" font-size="10" fill="#888" text-anchor="middle">maps result → ResponseDTO</text>
  <text x="495" y="244" font-size="10" fill="#888" text-anchor="middle">locally, per service</text>

  <line x1="495" y1="191" x2="495" y2="171" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="410" y="126" width="170" height="44" rx="4" fill="#fafaf7" stroke="#2563EB" stroke-width="1.4"/>
  <text x="495" y="146" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">SOAP Contract</text>
  <text x="495" y="162" font-size="10" fill="#888" text-anchor="middle">returns ResponseDTO as SOAP</text>

  <line x1="495" y1="125" x2="495" y2="105" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="410" y="60" width="170" height="44" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
  <text x="495" y="80" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer</text>
  <text x="495" y="96" font-size="10" fill="#888" text-anchor="middle">receives ResponseDTO-X</text>

  <!-- Key difference callout -->
  <rect x="220" y="192" width="220" height="68" rx="4" fill="#fff8f0" stroke="#059669" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="330" y="212" font-size="10" font-weight="bold" fill="#059669" text-anchor="middle">Key difference vs Option 1</text>
  <text x="330" y="228" font-size="10" fill="#555" text-anchor="middle">No Spring Boot hop.</text>
  <text x="330" y="244" font-size="10" fill="#555" text-anchor="middle">ResponseDTO mapped per service,</text>
  <text x="330" y="256" font-size="10" fill="#555" text-anchor="middle">not in one shared place.</text>
</svg>
