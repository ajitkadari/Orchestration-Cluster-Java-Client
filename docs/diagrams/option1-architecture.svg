<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 512" width="660" height="512" style="background:#fafaf7;font-family:'Segoe Print','Comic Sans MS','Chalkboard SE',cursive">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666460" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowhead-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Section title -->
  <text x="20" y="24" font-size="16" font-weight="bold" fill="#1a1a18">Option 1 — Spring Boot as integration layer</text>

  <!-- Dashed SOAP services group -->
  <rect x="118" y="44" width="350" height="182" rx="6" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="8 5"/>
  <text x="136" y="50" font-size="11" fill="#888">SOAP services</text>

  <!-- Consumer A -->
  <rect x="10" y="58" width="92" height="36" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.6"/>
  <text x="56" y="80" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer A</text>

  <!-- Consumer B -->
  <rect x="10" y="116" width="92" height="36" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.6"/>
  <text x="56" y="138" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer B</text>

  <!-- Consumer C -->
  <rect x="10" y="175" width="92" height="36" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.6"/>
  <text x="56" y="197" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer C</text>

  <!-- SOAP Service A outer box -->
  <rect x="126" y="52" width="334" height="166" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.4"/>
  <text x="136" y="66" font-size="10" fill="#888">SOAP Service A  (B and C: same structure)</text>

  <!-- SOAP Contract inner box -->
  <rect x="136" y="72" width="120" height="132" rx="4" fill="#fafaf7" stroke="#2563EB" stroke-width="1.4"/>
  <text x="196" y="96" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">SOAP Contract</text>
  <text x="196" y="116" font-size="10" fill="#666" text-anchor="middle">BusinessRequestDTO-X /</text>
  <text x="196" y="130" font-size="10" fill="#666" text-anchor="middle">BusinessResponseDTO-X</text>
  <text x="196" y="147" font-size="10" fill="#666" text-anchor="middle">WSDL / SOAP</text>

  <!-- REST Client inner box -->
  <rect x="268" y="72" width="180" height="132" rx="4" fill="#fafaf7" stroke="#888" stroke-width="1.3"/>
  <text x="358" y="96" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">REST Client</text>
  <text x="358" y="116" font-size="10" fill="#666" text-anchor="middle">Builds DecisionDTO</text>
  <text x="358" y="133" font-size="10" fill="#666" text-anchor="middle">HTTP calls →</text>

  <!-- Arrow SOAP Contract → REST Client -->
  <line x1="257" y1="138" x2="267" y2="138" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Consumer → Service arrows -->
  <line x1="103" y1="76" x2="125" y2="78" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="110" y="71" font-size="10" fill="#888">SOAP</text>
  <line x1="103" y1="134" x2="125" y2="128" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="103" y1="193" x2="125" y2="178" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Curved dashed arrow REST Client → Spring Boot -->
  <path d="M358 205 Q358 248 260 268" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
  <text x="348" y="242" font-size="10" fill="#888">DecisionDTO</text>

  <!-- Explicit return arrow Spring Boot → REST Client -->
  <path d="M410 272 Q430 236 402 205" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowhead-purple)"/>
  <text x="438" y="238" font-size="10" fill="#7C3AED">EvaluateDecisionResponse</text>

  <!-- Spring Boot Client box -->
  <rect x="18" y="272" width="624" height="124" rx="4" fill="#fafaf7" stroke="#059669" stroke-width="2"/>
  <text x="330" y="295" font-size="15" font-weight="bold" fill="#059669" text-anchor="middle">Spring Boot Client</text>
  <text x="330" y="316" font-size="11" fill="#555" text-anchor="middle">Receives DecisionDTO → uses Camunda via CamundaClient</text>
  <text x="330" y="334" font-size="11" fill="#555" text-anchor="middle">Returns EvaluateDecisionResponse</text>
  <text x="330" y="348" font-size="11" fill="#555" text-anchor="middle">to REST Client in SOAP Service</text>
  <line x1="36" y1="364" x2="624" y2="364" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="330" y="378" font-size="10" fill="#888" text-anchor="middle">camunda-client-java · CamundaClient · shared DecisionDTO</text>
  <text x="330" y="390" font-size="10" fill="#888" text-anchor="middle">shared EvaluateDecisionResponse</text>

  <!-- Arrow Spring Boot → Camunda -->
  <line x1="330" y1="398" x2="330" y2="422" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowhead-purple)"/>
  <text x="340" y="414" font-size="10" fill="#7C3AED">CamundaClient</text>

  <!-- Camunda Platform box -->
  <rect x="18" y="424" width="624" height="68" rx="4" fill="#fafaf7" stroke="#7C3AED" stroke-width="2"/>
  <text x="330" y="448" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">Camunda Platform</text>
  <text x="330" y="468" font-size="11" fill="#555" text-anchor="middle">REST APIs · Process engine · Decision engine</text>
  <text x="330" y="482" font-size="11" fill="#555" text-anchor="middle">Task management</text>
</svg>
