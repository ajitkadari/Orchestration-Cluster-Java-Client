<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" style="background:#fafaf7;font-family:'Segoe Print','Comic Sans MS','Chalkboard SE',cursive">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="20" y="24" font-size="16" font-weight="bold" fill="#1a1a18">Option 2 — Direct integration per SOAP service</text>

  <!-- Dashed SOAP services group -->
  <rect x="18" y="36" width="450" height="206" rx="6" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="8 5"/>
  <text x="36" y="50" font-size="10" fill="#888">SOAP services (each owns camunda-client-java)</text>

  <!-- Consumers -->
  <rect x="10" y="58" width="92" height="36" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.6"/>
  <text x="56" y="80" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer A</text>

  <rect x="10" y="120" width="92" height="36" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.6"/>
  <text x="56" y="142" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer B</text>

  <rect x="10" y="182" width="92" height="36" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.6"/>
  <text x="56" y="204" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">Consumer C</text>

  <!-- SOAP Service A outer box -->
  <rect x="126" y="52" width="334" height="180" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="1.4"/>
  <text x="136" y="66" font-size="10" fill="#888">SOAP Service A  (B and C: same structure)</text>

  <!-- SOAP Contract inner box -->
  <rect x="136" y="72" width="120" height="150" rx="4" fill="#fafaf7" stroke="#2563EB" stroke-width="1.4"/>
  <text x="196" y="96" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle">SOAP Contract</text>
  <text x="196" y="116" font-size="10" fill="#666" text-anchor="middle">BusinessRequestDTO-X /</text>
  <text x="196" y="130" font-size="10" fill="#666" text-anchor="middle">BusinessResponseDTO-X</text>
  <text x="196" y="147" font-size="10" fill="#666" text-anchor="middle">WSDL / SOAP</text>

  <!-- REST Client inner box (bigger — owns camunda) -->
  <rect x="268" y="72" width="182" height="150" rx="4" fill="#fafaf7" stroke="#888" stroke-width="1.3"/>
  <text x="359" y="96" font-size="12" font-weight="bold" fill="#1a1a18" text-anchor="middle">REST Client</text>
  <text x="359" y="114" font-size="10" fill="#666" text-anchor="middle">camunda-client-java</text>
  <text x="359" y="130" font-size="10" fill="#666" text-anchor="middle">CamundaClient</text>
  <text x="359" y="146" font-size="10" fill="#666" text-anchor="middle">DecisionDTO</text>
  <text x="359" y="162" font-size="10" fill="#666" text-anchor="middle">uses EvaluateDecisionResponse</text>
  <text x="359" y="178" font-size="10" fill="#666" text-anchor="middle">to complete BusinessResponseDTO-X</text>

  <!-- Arrow SOAP Contract → REST Client -->
  <line x1="257" y1="147" x2="267" y2="147" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Consumer → Service arrows -->
  <line x1="103" y1="76" x2="125" y2="78" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="110" y="71" font-size="10" fill="#888">SOAP</text>
  <line x1="103" y1="138" x2="125" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="103" y1="200" x2="125" y2="186" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Direct bold arrow REST Client → Camunda -->
  <line x1="359" y1="223" x2="359" y2="268" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arr-p)"/>
  <text x="368" y="252" font-size="10" fill="#7C3AED">DecisionDTO (direct)</text>

  <!-- No Spring Boot annotation -->
  <line x1="490" y1="188" x2="570" y2="188" stroke="#059669" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="574" y="184" font-size="10" fill="#059669">No Spring Boot</text>
  <text x="574" y="198" font-size="10" fill="#059669">intermediary</text>

  <!-- Camunda Platform box -->
  <rect x="18" y="270" width="624" height="68" rx="4" fill="#fafaf7" stroke="#7C3AED" stroke-width="2"/>
  <text x="330" y="294" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="middle">Camunda Platform</text>
  <text x="330" y="316" font-size="11" fill="#555" text-anchor="middle">REST APIs · Process engine · Decision engine · Task management</text>

  <!-- Response arrow back up to REST Client (dashed) -->
  <path d="M520 270 Q500 232 450 186" fill="none" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr-p)"/>
  <text x="502" y="244" font-size="9" fill="#7C3AED">EvaluateDecisionResponse</text>
  <text x="502" y="256" font-size="9" fill="#7C3AED">to REST Client</text>
</svg>
